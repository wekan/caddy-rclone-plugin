name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Turn off Go toolchain telemetry
        run: go telemetry off
      # CGO off, as Caddy is built.
      - run: go vet ./...
        env:
          CGO_ENABLED: "0"
      - run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
